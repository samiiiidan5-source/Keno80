<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Keno</title>
    <!-- Include Telegram Web App SDK -->
    <script src="https://egotism-plating-ambiguous.ngrok-free.dev/"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1f2125);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin: 5px 0 15px 0; text-align: center; }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--hint-color);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }
        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
        }
        .cell.selected {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border-color: transparent;
        }
        .cell.hit {
            background-color: #2ecc71 !important;
            color: #fff !important;
            transform: scale(1.1);
        }
        .cell.drawn {
            background-color: #e74c3c;
            color: #fff;
        }
        .controls {
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button.action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            background-color: var(--button-color);
            color: var(--button-text-color);
            cursor: pointer;
        }
        button.action-btn:active { opacity: 0.8; }
        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
        }
        .footer-info {
            font-size: 13px;
            color: var(--hint-color);
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>⚡ Fast Keno</h2>
    
    <div class="stats-bar">
        <span>Balance: <strong id="balance">1000</strong> 🪙</span>
        <span>Bet: <strong id="current-bet">10</strong> 🪙</span>
    </div>

    <!-- Keno Grid (1 to 80) -->
    <div class="grid" id="keno-grid"></div>

    <div class="controls">
        <button class="action-btn secondary" onclick="clearSelection()">Clear</button>
        <button class="action-btn secondary" onclick="quickPick()">Quick Pick</button>
        <button class="action-btn" id="play-btn" onclick="startDraw()">PLAY</button>
    </div>

    <div class="footer-info" id="status-text">Select up to 10 numbers and hit Play!</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Expand mini app to full screen

        let balance = 1000;
        let currentBet = 10;
        let selectedNumbers = new Set();
        let isPlaying = false;
        const maxSelections = 10;

        const gridEl = document.getElementById('keno-grid');
        const balanceEl = document.getElementById('balance');
        const statusEl = document.getElementById('status-text');
        const playBtn = document.getElementById('play-btn');

        // Initialize 1-80 Grid
        function initGrid() {
            gridEl.innerHTML = '';
            for (let i = 1; i <= 80; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.textContent = i;
                cell.dataset.number = i;
                cell.addEventListener('click', () => toggleNumber(i, cell));
                gridEl.appendChild(cell);
            }
        }

        function toggleNumber(num, cellEl) {
            if (isPlaying) return;

            if (selectedNumbers.has(num)) {
                selectedNumbers.delete(num);
                cellEl.classList.remove('selected');
            } else {
                if (selectedNumbers.size >= maxSelections) {
                    tg.HapticFeedback.notificationOccurred('error');
                    statusEl.textContent = `You can pick a maximum of ${maxSelections} numbers!`;
                    return;
                }
                selectedNumbers.add(num);
                cellEl.classList.add('selected');
                tg.HapticFeedback.impactOccurred('light');
            }
            statusEl.textContent = `Selected: ${selectedNumbers.size}/${maxSelections}`;
        }

        function clearSelection() {
            if (isPlaying) return;
            selectedNumbers.clear();
            document.querySelectorAll('.cell').forEach(c => c.className = 'cell');
            statusEl.textContent = 'Selection cleared.';
            tg.HapticFeedback.impactOccurred('medium');
        }

        function quickPick() {
            if (isPlaying) return;
            clearSelection();
            while (selectedNumbers.size < 5) {
                let randomNum = Math.floor(Math.random() * 80) + 1;
                selectedNumbers.add(randomNum);
            }
            selectedNumbers.forEach(num => {
                document.querySelector(`[data-number="${num}"]`).classList.add('selected');
            });
            statusEl.textContent = `Quick Picked 5 numbers.`;
            tg.HapticFeedback.impactOccurred('medium');
        }

        // Simple payout table based on hits
        const payoutTable = {
            1: { 1: 3 },
            2: { 2: 9 },
            3: { 2: 1, 3: 25 },
            4: { 2: 2, 3: 5, 4: 50 },
            5: { 3: 3, 4: 15, 5: 200 }
        };

        function startDraw() {
            if (isPlaying) return;
            if (selectedNumbers.size === 0) {
                statusEl.textContent = 'Please pick at least 1 number!';
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }
            if (balance < currentBet) {
                statusEl.textContent = 'Not enough balance!';
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            balance -= currentBet;
            balanceEl.textContent = balance;
            isPlaying = true;
            playBtn.disabled = true;
            statusEl.textContent = 'Drawing numbers...';

            // Reset visual states
            document.querySelectorAll('.cell').forEach(c => {
                if (!selectedNumbers.has(parseInt(c.dataset.number))) {
                    c.className = 'cell';
                }
            });

            // Simulate Fast Keno Draw (Pick 20 random numbers out of 80)
            let drawnNumbers = new Set();
            while(drawnNumbers.size < 20) {
                drawnNumbers.add(Math.floor(Math.random() * 80) + 1);
            }

            let drawnArray = Array.from(drawnNumbers);
            let index = 0;
            let hits = 0;

            // Animate draw one by one for that fast-paced casino thrill
            let interval = setInterval(() => {
                if (index < drawnArray.length) {
                    let num = drawnArray[index];
                    let cell = document.querySelector(`[data-number="${num}"]`);
                    
                    if (selectedNumbers.has(num)) {
                        cell.className = 'cell hit';
                        hits++;
                        tg.HapticFeedback.impactOccurred('heavy');
                    } else {
                        cell.className = 'cell drawn';
                    }
                    index++;
                } else {
                    clearInterval(interval);
                    
                    // Calculate winnings
                    let multiplier = (payoutTable[selectedNumbers.size] && payoutTable[selectedNumbers.size][hits]) || 0;
                    let winAmount = currentBet * multiplier;

                    if (winAmount > 0) {
                        balance += winAmount;
                        balanceEl.textContent = balance;
                        statusEl.textContent = `🎉 You hit ${hits} numbers & won ${winAmount} 🪙!`;
                        tg.HapticFeedback.notificationOccurred('success');
                    } else {
                        statusEl.textContent = `You hit ${hits} numbers. Better luck next time!`;
                        tg.HapticFeedback.notificationOccurred('warning');
                    }

                    isPlaying = false;
                    playBtn.disabled = false;
                }
            }, 100); // 100ms per ball draw for lightning-fast gameplay
        }

        initGrid();
    </script>
</body>
</html>
# This workflow will build and push a node.js application to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-nodejs?tabs=linux&pivots=development-environment-cli
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the AZURE_WEBAPP_PACKAGE_PATH and NODE_VERSION environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: your-app-name    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '20.x'                # set this to the node version to use

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: npm install, build, and test
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: .

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
